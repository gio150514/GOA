<html>
<body>

<h1>რეგისტრაცია</h1>

<form>

<label>სახელი:</label>
<input type="text" name="name">

<br><br>

<label>პაროლი:</label>
<input type="password" name="password">

<br><br>

<h3>აირჩიე ასაკი:</h3>

<select name="age">
<option value="15">15</option>
<option value="16">16</option>
<option value="17">17</option>
</select>

<br><br>

<h3>საყვარელი ენა:</h3>

<input type="radio" name="language" value="python"> Python
<input type="radio" name="language" value="html"> HTML

<br><br>

<h3>უნარები:</h3>

<input type="checkbox" name="skill" value="coding"> Coding
<input type="checkbox" name="skill" value="design"> Design

<br><br>

<input type="submit" value="გაგზავნა">

</form>

</body>
</html>
